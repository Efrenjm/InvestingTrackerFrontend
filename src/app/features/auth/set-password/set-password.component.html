<app-auth-layout
  title="Create your password"
  subtitle="Set a secure password to finalize setting up your account"
>
  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-5">
    
    <app-password-fields
      [passwordControl]="newPasswordControl"
      [confirmPasswordControl]="confirmPasswordControl"
      passwordLabel="New Password"
      passwordPlaceholder="••••••••••••"
      confirmPasswordPlaceholder="••••••••••••"
    ></app-password-fields>

    <!-- Submit Button -->
    <div class="pt-2">
      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [disabled]="passwordForm.invalid || !passwordsMatch || isLoading()"
        class="w-full"
      >
        @if (isLoading()) {
          <mat-spinner diameter="20" class="inline-block"></mat-spinner>
          <span>Saving Password...</span>
        } @else {
          <span>Set Password & Finish</span>
          <mat-icon class="!w-5 !h-5 !text-[20px]">arrow_forward</mat-icon>
        }
      </app-button>
    </div>
  </form>
</app-auth-layout>
