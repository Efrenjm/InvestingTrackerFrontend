<app-auth-layout
  title="Create an account"
  subtitle="Enter your email to get started with Investing Tracker"
>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
    <!-- Email Input -->
    <app-input
      label="Email Address"
      type="email"
      placeholder="you@example.com"
      icon="mail"
      [control]="emailControl"
    ></app-input>

    <!-- Submit Button -->
    <div class="pt-2">
      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [disabled]="registerForm.invalid || isLoading()"
        class="w-full"
      >
        @if (isLoading()) {
          <mat-spinner diameter="20" class="inline-block"></mat-spinner>
          <span>Sending verification code...</span>
        } @else {
          <span>Continue</span>
          <mat-icon class="!w-5 !h-5 !text-[20px]">arrow_forward</mat-icon>
        }
      </app-button>
    </div>

    <!-- Login Footer Link -->
    <div class="text-center pt-3 border-t border-slate-700/50 text-xs text-slate-400">
      Already have an account?
      <a
        routerLink="/auth/login"
        class="text-indigo-400 font-semibold hover:text-indigo-300 transition-colors hover:underline ml-1"
      >
        Log In
      </a>
    </div>
  </form>
</app-auth-layout>
