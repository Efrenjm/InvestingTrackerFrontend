<div class="space-y-5">
  <div class="relative">
    <app-input
      [label]="passwordLabel()"
      [type]="showPassword() ? 'text' : 'password'"
      [placeholder]="passwordPlaceholder()"
      icon="lock"
      [control]="passwordControl()"
      [showErrors]="false"
    ></app-input>

    <button
      type="button"
      (click)="togglePassword()"
      class="absolute right-3 top-9 text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-md"
      [title]="showPassword() ? 'Hide password' : 'Show password'"
    >
      <mat-icon class="!w-5 !h-5 !text-[20px]">
        {{ showPassword() ? 'visibility_off' : 'visibility' }}
      </mat-icon>
    </button>
  </div>

  @if (passwordValue()) {
    <div class="space-y-2 p-3.5 rounded-2xl bg-gray-50 border border-gray-200 text-xs">
      <div class="flex items-center justify-between">
        <span class="text-gray-500 font-medium">Password Strength:</span>
        <span
          class="font-semibold"
          [class.text-red-500]="strength().label === 'Weak'"
          [class.text-amber-500]="strength().label === 'Medium'"
          [class.text-emerald-600]="strength().label === 'Strong'"
        >
          {{ strength().label }}
        </span>
      </div>

      <div
        class="h-1.5 w-full bg-gray-200 rounded-full overflow-hidden"
        role="progressbar"
        aria-label="Password strength"
        [attr.aria-valuenow]="strength().score"
        aria-valuemin="0"
        aria-valuemax="6"
      >
        <div
          class="h-full transition-all duration-300 rounded-full"
          [class.bg-red-400]="strength().label === 'Weak'"
          [class.bg-amber-400]="strength().label === 'Medium'"
          [class.bg-emerald-400]="strength().label === 'Strong'"
          [style.width.%]="(strength().score / 6) * 100"
        ></div>
      </div>

      <div class="pt-2 border-t border-gray-200 space-y-1.5">
        @for (check of checks(); track check.label) {
          <div class="flex items-center gap-2" data-password-requirement>
            <mat-icon
              class="h-4! w-4! text-[16px]!"
              [class.text-emerald-600]="check.met"
              [class.text-gray-400]="!check.met"
              aria-hidden="true"
            >
              {{ check.met ? 'check_circle' : 'radio_button_unchecked' }}
            </mat-icon>
            <span [class.text-emerald-700]="check.met" [class.text-gray-500]="!check.met">
              {{ check.label }}
            </span>
          </div>
        }
      </div>
    </div>
  }

  <div class="space-y-1">
    <app-input
      [label]="confirmPasswordLabel()"
      [type]="showPassword() ? 'text' : 'password'"
      [placeholder]="confirmPasswordPlaceholder()"
      icon="lock"
      [control]="confirmPasswordControl()"
      [showErrors]="false"
      (blurred)="confirmPasswordTouched.set(true)"
    ></app-input>

    @if (confirmPasswordTouched() && !passwordsMatch()) {
      <p class="text-xs text-red-500 mt-1 flex items-center gap-1">
        <mat-icon class="!w-4 !h-4 !text-[16px]">error_outline</mat-icon>
        Passwords do not match
      </p>
    }
  </div>
</div>
