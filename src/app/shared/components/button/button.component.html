<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses"
  (click)="onClick.emit($event)"
>
  @if (loading()) {
    <mat-spinner
      diameter="20"
      class="button-spinner"
    ></mat-spinner>
    <span class="ml-2">Cargando...</span>
  } @else {
    <ng-content></ng-content>
  }
</button>
